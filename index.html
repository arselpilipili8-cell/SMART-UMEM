
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Umeme</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Police Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icônes -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Fond sombre -->
    <div class="overlay">

        <!-- Logo -->
        <div class="logo">

            <i class="fa-solid fa-bolt"></i>

        </div>

        <!-- Titre -->
        <h1 class="title">

            SMART <span>UMEME</span>

        </h1>

        <!-- Sous titre -->

        <p class="subtitle">

            Smart Electrical Monitoring System

        </p>

        <!-- Ligne décorative -->

        <div class="line"></div>

        <!-- Texte -->

        <p class="welcome">

            Bienvenue dans le système intelligent de supervision des cabines électriques.

        </p>

        <!-- Barre de chargement -->

        <div class="loader">

            <div class="progress"></div>

        </div>

        <!-- Pourcentage -->

        <div class="percent" id="percent">

            0%

        </div>

        <!-- Chargement -->

        <div class="loading-text">

            <i class="fa-solid fa-circle-notch fa-spin"></i>

            Chargement...

        </div>

        <!-- Pied de page -->

        <footer>

            © 2026 Smart Umeme | Version 1.0

        </footer>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
